# Weekly sync of the law inventory with the official code websites (Pakistan Code, Punjab Code, Sindh Code,
# KP Code, Balochistan Code, Sindh Judicial Academy). New principal laws and changed official PDFs are
# downloaded, validated and indexed, and the result is proposed as a pull request for human review.
#
# Sources and policies: frontend/data/sources/official_sources.csv
# Pipeline docs:        backend/docs/SOURCE_SYNC_PIPELINE.md
name: Legal sources sync

on:
  schedule:
    - cron: "30 1 * * 1"   # Mondays 01:30 UTC = 06:30 Pakistan time
  workflow_dispatch:
    inputs:
      ingest:
        description: "Add new laws / refresh changed PDFs and re-index (otherwise inventory only)"
        type: boolean
        default: true
      resolve:
        description: "PDF link checking: auto (new/changed/tracked) or all (slow, ~1 h)"
        type: choice
        options: [auto, all]
        default: auto

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: legal-sources-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # PDFs and embeddings are git-ignored (reproducible); cache them so weekly runs only fetch/embed changes.
      - name: Restore corpus PDFs, embeddings and model cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/pakistan_legal_corpus/**/*.pdf
            frontend/data/rag_index/legal_chunk_embeddings.npy
            frontend/data/rag_index/legal_chunk_embeddings.meta.json
            backend/.cache
          key: legal-corpus-${{ github.run_id }}
          restore-keys: legal-corpus-

      - name: Restore any missing official PDFs (hash-checked against provenance)
        run: python scripts/acquire_corpus.py

      - name: Sync sources
        id: sync
        run: |
          set +e
          ARGS="--resolve ${{ github.event.inputs.resolve || 'auto' }}"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.ingest }}" = "true" ]; then
            ARGS="$ARGS --ingest"
          fi
          python scripts/sync_sources.py $ARGS
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 2 = at least one source failed (site down); still propose what the other sources produced.
          if [ $code -ne 0 ] && [ $code -ne 2 ]; then exit $code; fi

      - name: Run tests
        run: python -m pytest tests -q -k "not test_secrets_are_not_committed"

      - name: Propose changes as a pull request
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "legal-sources-sync[bot]"
          git config user.email "legal-sources-sync@users.noreply.github.com"
          BRANCH="automation/legal-sources-sync"
          git checkout -B "$BRANCH"
          git add frontend/data/sources frontend/data/member4_manifest.csv frontend/data/member4_manifest.json \
                  frontend/data/legal_documents.csv frontend/data/legal_documents.json frontend/supabase/seed.sql \
                  frontend/pakistan_legal_corpus/provenance.json frontend/data/rag_index/legal_chunks.jsonl
          if git diff --cached --quiet; then
            echo "No changes to propose."
            exit 0
          fi
          git commit -m "Legal sources sync $(date -u +%Y-%m-%d)"
          git push --force origin "$BRANCH"
          BODY=frontend/data/sources/last_run_summary.md
          gh pr view "$BRANCH" >/dev/null 2>&1 \
            && gh pr edit "$BRANCH" --body-file "$BODY" \
            || gh pr create --head "$BRANCH" --title "Legal sources sync" --body-file "$BODY"

      - name: Flag failed sources
        if: steps.sync.outputs.exit_code == '2'
        run: |
          echo "::warning::At least one official source could not be crawled this run; see last_run_summary.md"
